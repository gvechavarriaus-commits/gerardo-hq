<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1a0e">
  <title>Gerardo HQ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Gerardo HQ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23171512'/><circle cx='32' cy='32' r='12' fill='%23F4C443'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <div class="shell">
    <header class="top">
      <div class="brand">
        <span class="brand-dot"></span>
        <div>
          <h1 id="title">Gerardo HQ</h1>
          <p id="today" class="muted"></p>
        </div>
        <button id="sync-btn" class="lock-btn glass" type="button" title="Saving on this device" aria-label="Saving on this device">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 9.2 4.5 4.5 0 0 0 7 18z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button id="lock-btn" class="lock-btn glass" style="margin-left:6px" type="button" title="Lock and forget the code on this device" aria-label="Lock">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>

      <nav class="tabs" id="tabs" aria-label="Sections">
        <button data-tab="overview">Overview</button>
        <button data-tab="business">Business</button>
        <button data-tab="university">University</button>
        <button data-tab="personal">Personal</button>
        <button data-tab="stocks">Stocks</button>
        <button data-tab="calendar">Calendar</button>
      </nav>

      <div class="tools">
        <label class="search glass">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search projects, courses, notes…" autocomplete="off">
        </label>
        <div class="filters glass" id="filters" role="group" aria-label="Filter by status">
          <button data-status="all">All</button>
          <button data-status="idea">Idea</button>
          <button data-status="active">Active</button>
          <button data-status="paused">Paused</button>
          <button data-status="done">Done</button>
        </div>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="foot muted">Private · locked with your secret code.</footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
