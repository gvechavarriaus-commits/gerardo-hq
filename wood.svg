<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Long horizontal grain: stretched noise mapped to walnut browns -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.075" numOctaves="5" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0.95 0 0 0 -0.045
                0.65 0 0 0 -0.055
                0.40 0 0 0 -0.040
                0    0 0 0  1"/>
    </filter>
    <!-- Fine pores and streaks laid on top -->
    <filter id="pores" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.6" numOctaves="2" seed="4" result="fine"/>
      <feColorMatrix in="fine" type="matrix"
        values="0 0 0 0 0.10
                0 0 0 0 0.05
                0 0 0 0 0.02
                -1.4 0 0 0 0.95"/>
    </filter>
    <!-- Gentle light-to-dark sheen across each plank -->
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" filter="url(#grain)"/>
  <rect width="1600" height="1200" filter="url(#pores)" opacity=".55"/>

  <!-- Planks with slightly different tones and seams -->
  <g>
    <rect y="0"    width="1600" height="200" fill="url(#plank)"/>
    <rect y="200"  width="1600" height="200" fill="url(#plank)"/>
    <rect y="200"  width="1600" height="200" fill="#000" opacity=".06"/>
    <rect y="400"  width="1600" height="200" fill="url(#plank)"/>
    <rect y="600"  width="1600" height="200" fill="url(#plank)"/>
    <rect y="600"  width="1600" height="200" fill="#3b1d06" opacity=".08"/>
    <rect y="800"  width="1600" height="200" fill="url(#plank)"/>
    <rect y="1000" width="1600" height="200" fill="url(#plank)"/>
    <rect y="1000" width="1600" height="200" fill="#000" opacity=".05"/>
  </g>
  <g fill="#1a0d05" opacity=".55">
    <rect y="199" width="1600" height="2"/>
    <rect y="399" width="1600" height="2"/>
    <rect y="599" width="1600" height="2"/>
    <rect y="799" width="1600" height="2"/>
    <rect y="999" width="1600" height="2"/>
    <!-- staggered end joints -->
    <rect x="610"  y="0"    width="2" height="200"/>
    <rect x="1240" y="200"  width="2" height="200"/>
    <rect x="320"  y="400"  width="2" height="200"/>
    <rect x="980"  y="600"  width="2" height="200"/>
    <rect x="150"  y="800"  width="2" height="200"/>
    <rect x="1420" y="800"  width="2" height="200"/>
    <rect x="760"  y="1000" width="2" height="200"/>
  </g>
</svg>
